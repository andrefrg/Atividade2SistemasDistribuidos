events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # Configurações básicas
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    
    # Timeouts ajustados para cenários de alta carga
    client_body_timeout 60;
    client_header_timeout 60;
    send_timeout 60;
    
    # Buffer sizes ajustados para lidar com payloads maiores
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    large_client_header_buffers 4 16k;
    
    # Configuração para evitar problemas com conexões
    reset_timedout_connection on;
    
    # Melhorias para lidar com picos de carga
    client_body_in_file_only clean;
    client_body_in_single_buffer on;

    # Configuração para health checks passivos
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504 http_404;
    proxy_next_upstream_timeout 2s;
    proxy_next_upstream_tries 3;
    
    # Configuração para usar até 3 instâncias da API, com detecção rápida de falhas
    upstream api_servers {
        # Configuração de max_fails=1 para detectar falhas rapidamente
        # e fail_timeout=10s para não tentar usar o servidor por 10 segundos após falha
        server api:8000 max_fails=1 fail_timeout=10s;
        server api:8000 max_fails=1 fail_timeout=10s;
        server api:8000 max_fails=1 fail_timeout=10s;
        
        least_conn;
        
        keepalive 32;
        
        zone api_zone 64k;
    }

    server {
        listen 80;
        
        # Timeouts aumentados para garantir que operações mais pesadas concluam
        proxy_connect_timeout 30;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
        
        # Ajustes de buffer para evitar problemas com respostas/requests
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_temp_file_write_size 256k;
        
        # Retry logic
        proxy_next_upstream_tries 5;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_timeout 5s;
        
        # Manter conexões abertas para melhor performance
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Cache de DNS para resolver nomes rapidamente
        resolver 127.0.0.11 valid=1s;
        resolver_timeout 1s;
        
        location / {
            # Usando variável para resolver o nome do servidor a cada requisição
            set $upstream_api "http://api:8000";
            proxy_pass $upstream_api;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Adicionar headers úteis para a API
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Host $host;
            
            # Garantir que o corpo da requisição seja passado corretamente
            proxy_request_buffering on;
            
            # Verificação de saúde dinâmica
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @fallback;
        }
        
        location @fallback {
            set $upstream_api "http://api:8000";
            proxy_pass $upstream_api;
            proxy_next_upstream off;
        }
        
        location /health {
            access_log off;
            return 200;
        }
        
        # Endpoint para monitoramento do status
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
} 