global
    log stdout format raw local0
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 10s
    timeout client  30s
    timeout server  30s
    retries 3

listen rabbitmq_cluster
    bind *:5670
    mode tcp
    balance roundrobin
    option tcpka
    option tcp-check
    server rabbitmq1 rabbitmq1:5672 check inter 5s rise 2 fall 3
    server rabbitmq2 rabbitmq2:5672 check inter 5s rise 2 fall 3 backup
    server rabbitmq3 rabbitmq3:5672 check inter 5s rise 2 fall 3 backup

listen rabbitmq_admin
    bind *:15670
    mode http
    balance roundrobin
    option httplog
    option httpchk GET /api/health
    server rabbitmq1 rabbitmq1:15672 check inter 5s rise 2 fall 3
    server rabbitmq2 rabbitmq2:15672 check inter 5s rise 2 fall 3 backup
    server rabbitmq3 rabbitmq3:15672 check inter 5s rise 2 fall 3 backup

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 10s 
