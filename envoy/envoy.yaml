admin:
  access_log_path: /tmp/admin_access.log
  address:
    socket_address:
      protocol: TCP
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  - name: redis_listener
    address:
      socket_address:
        protocol: TCP
        address: 0.0.0.0
        port_value: 6379
    filter_chains:
    - filters:
      - name: envoy.filters.network.redis_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.redis_proxy.v3.RedisProxy
          stat_prefix: redis_stats
          settings:
            op_timeout: 5s
            enable_redirection: true
            max_buffer_size_before_flush: 1024
          prefix_routes:
            routes:
              - prefix: ""
                cluster: redis_cluster

  clusters:
  - name: redis_cluster
    connect_timeout: 1s
    type: STRICT_DNS
    lb_policy: MAGLEV
    load_assignment:
      cluster_name: redis_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: redis-master
                port_value: 6379
          health_status: HEALTHY  
          load_balancing_weight: 100
        - endpoint:
            address:
              socket_address:
                address: redis-replica
                port_value: 6379
          health_status: HEALTHY
          load_balancing_weight: 0
    health_checks:
      - timeout: 0.5s
        interval: 1s
        no_traffic_interval: 1s
        unhealthy_threshold: 1
        healthy_threshold: 1
        tcp_health_check: {}
    circuit_breakers:
      thresholds:
        - priority: DEFAULT
          max_connections: 1000
          max_pending_requests: 1000
          max_requests: 1000
        - priority: HIGH
          max_connections: 2000
          max_pending_requests: 2000
          max_requests: 2000
    outlier_detection:
      consecutive_5xx: 1
      base_ejection_time: 5s
      max_ejection_percent: 50
      consecutive_gateway_failure: 1
      enforcing_consecutive_5xx: 100
      enforcing_consecutive_gateway_failure: 100
      success_rate_minimum_hosts: 1
      success_rate_request_volume: 10
      success_rate_stdev_factor: 1900 